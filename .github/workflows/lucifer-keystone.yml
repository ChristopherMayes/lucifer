# Lucifer's own checks, on Linux.
#
# Every level Lucifer records was measured on one machine, an Apple M3 Max running
# macOS. This job runs the same checks on Linux, which is the only way a defect that
# one platform hides and another shows ever gets found. The project has paid for one
# already: five wake cases failed on Linux because a steady-state run read past the end
# of a one-element vector, and the macOS allocator had been answering with a number that
# happened to work. The debug build is what reaches that class, since -fbounds-check
# turns such a read into a failure rather than a wrong number.
#
# Bmad comes from conda-forge's bmad package, installed from environment.yml at the
# repository root, and Lucifer builds against it with the two cmake lines of
# docs/user-guide.md, the first route there. Bmad ships on conda-forge, so this is the
# configuration most people will run, and a check is worth more against what is delivered
# than against a configuration only the off-site distribution assembles. Nothing is
# cloned and no distribution is built: until 2026-10-23 the job cloned bmad-sim/bmad-ecosystem
# at the declared release and built its debug tree for 6.4 minutes before Lucifer's own
# build began. util/bmad_release_check reads the package's release from its
# bmad_version_mod.mod and refuses one below BMAD_RELEASE before anything is built. The
# declared release is a minimum, so a green run certifies that release and no later one.
#
# The package is a production build of Bmad. Lucifer's Debug configuration is built
# against it, so Lucifer's own code runs with -fbounds-check and Bmad's does not, where
# the recording machine's debug pass runs both bounds-checked against the distribution's
# debug tree. The tracker and the reference read one HDF5: lucifer resolves the package
# environment's through the rpath it was built with, and genesis4 resolves its own, where
# a shared build reached through LD_LIBRARY_PATH would offer the reference a library it
# was not linked against. The recording machine keeps those two environments apart for
# exactly that reason.
#
# What this varies and what it does not, so the coverage is not overstated. It varies the
# operating system, the C library, the allocator, every dependency build and the Bmad
# build itself, which is conda-forge's and not the distribution's, and it runs the tiers
# and the check sections, which nothing outside this laptop has ever run. It does not
# vary the compiler project, which is conda-forge gfortran on both sides. The
# distribution's own CI builds with the system compiler, which is how an unconditional
# -lfftw3f was caught, and it runs no tier.
#
# It does NOT compare digits. A different FFTW and HDF5 give different last digits by
# construction, so the eleven recorded tier levels stay a property of the machine that
# recorded them and the tolerances are what gets asserted here. A reader who believes
# this job guards the recorded digits will eventually trust it to.
#
# What is deliberately not here, so the difference from the local keystone is on the
# record: the production build and the two-build digit comparison, the examples, and
# Bmad's own regression suite, which the package does not carry and Bmad's own CI runs.
# The device section cannot run on a runner with no Metal device and skips with its
# reason recorded, the one section allowed to.
#
# `workflow_dispatch` and `schedule` read this file from the repository's default branch,
# main, rather than from the ref they name, which is GitHub's rule for both. `push` is the
# trigger that reads the pushed ref.
#
# On every push to the branch, and weekly besides. Every commit here is validated before
# it lands, and the keystone that does it runs on one macOS machine, so a per-push run is
# what extends that rule to a second platform. The wall clock recorded below is the
# price, and the concurrency group above bounds it: a second push cancels the first run
# rather than queueing behind it, so a day of six pushes costs one run and not six. A
# path filter would be no substitute, since the defects this reaches come from the
# platform rather than from which file moved.
#
# It does not replace Bmad's own CI, which builds the whole distribution on every push
# to Bmad.

name: Lucifer - Keystone (Linux)

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keystone:
    runs-on: ubuntu-latest
    # Measured on this runner on 2026-10-23, with the Bmad clone and its 6.4-minute debug
    # build: 37.5 minutes end to end, of which the harness is 30 and the two environments
    # 1.1. The harness costs four times its local 7.7 minutes because a runner has four
    # cores against the recording machine's sixteen and its Genesis references are always
    # cold, and its longest sections are spontaneous at 642 s and the eleven tiers at
    # 320 s. The package build's own wall clock is in docs/changelog.md.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      # The build environment is the repository's own file: conda-forge's bmad in its
      # nompi variant, the compilers and cmake, each a minimum. The package resolves on the
      # day the job runs, so the release it carries is checked against BMAD_RELEASE below
      # and printed.
      - name: Install the build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: lucifer-build
          channels: conda-forge
          environment-file: environment.yml
          conda-remove-defaults: true

      # The package's release against the declared minimum, read from the module file the
      # package installs. The check prints both and refuses a package below the minimum.
      - name: Check the package's release
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate lucifer-build
          set -e
          conda list bmad | grep '^bmad '
          util/bmad_release_check "$CONDA_PREFIX"

      # The two cmake lines of the user guide, in the Debug configuration. The Fortran and
      # C compilers are named by path, since the compiler packages export nothing on
      # activation and CMake would otherwise take the first gfortran on PATH. HDF5_ROOT pins
      # the library to this environment, since CMake's FindHDF5 otherwise prefers whichever
      # h5fc is first on PATH, and a mismatch across a major version can compile and link.
      # The three binaries the later steps need are listed after the build, so a build
      # that half worked cannot pass.
      - name: Build the debug configuration against the package
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate lucifer-build
          set -e
          export FC="$CONDA_PREFIX/bin/gfortran"
          for f in "$CONDA_PREFIX"/bin/*-cc "$CONDA_PREFIX"/bin/*-gcc "$CONDA_PREFIX"/bin/clang; do
            [ -x "$f" ] && { export CC="$f"; break; }
          done
          echo "FC=$FC CC=${CC:-unset, so CMake chooses}"
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug \
                -DLUCIFER_BMAD_ROOT="$CONDA_PREFIX" -DHDF5_ROOT="$CONDA_PREFIX"
          cmake --build build-debug --parallel "$(nproc)"
          ls -l build-debug/bin/lucifer build-debug/bin/lucifer_smoke_test \
                build-debug/bin/wavefront_drift_test "$CONDA_PREFIX/bin/tao"
          echo "LUCIFER_BMAD_ROOT=$CONDA_PREFIX" >> "$GITHUB_ENV"

      # Which backend this build carries, from lucifer's own banner. This is the line the
      # harness reads to decide whether the device section can run, so having it in the
      # log makes the skip below checkable rather than asserted.
      - name: Name the device backend
        shell: bash
        run: ./build-debug/bin/lucifer || true

      # One environment for the reference and the Python side, from the repository's own
      # file, which pins genesis4 4.6.15. The pin is the whole reason this job is
      # possible: releases to 4.6.14 carry a pre-CODATA electron rest energy and seed
      # their noise per MPI rank, and the harness refuses any other version, printing what it found and wanted. It
      # is separate from the build environment for the reason the recording machine keeps
      # them separate, and the harness finds it by name.
      - name: Install the reference and the Python side
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          set -e
          conda env create -f tests/wavefront/environment.yml
          # The reference's own banner, so a wrong version is visible here rather than
          # only in the harness's refusal. genesis4 exits non-zero when it is given no
          # input file, which is not a failure of this step.
          conda run -n bmad-fel-validate genesis4 2>&1 | head -3 || true
          # openPMD-beamphysics comes from the same file, at the minimum it states or
          # later. The harness prints the version and path again before its sections run.
          conda run -n bmad-fel-validate python -c \
              "import beamphysics; print('openPMD-beamphysics', beamphysics.__version__)"

      # The harness prints the reference version and the electron rest energy it carries,
      # every section's name and wall time, and every tier's level against its tolerance.
      # Its exit status is zero only if every tier passed. Run from the validate
      # environment, which is how the recording machine runs it.
      - name: Benchmark harness, debug build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./tests/run_fel_benchmark.sh \
              --exe "$PWD/build-debug/bin/lucifer" --build debug \
              --results "$RUNNER_TEMP/fel-debug.txt" \
              --work-dir "$RUNNER_TEMP/wd-dbg"

      - name: Wavefront validation
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./tests/wavefront/run_validation.sh \
              --work-dir "$RUNNER_TEMP/wd-wf"

      # The results file records what ran, what skipped and why, and each tier's level.
      # It is not what writes the generated table: report_validation.py refuses a file
      # carrying a skip, because that table names every section that ran and this run is
      # one short. The table stays the product of a full local run on both builds.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fel-debug.txt" ]; then
            {
              echo '## Lucifer keystone, Linux debug build'
              echo
              echo 'Levels are this platform'"'"'s own. The recorded digits belong to the'
              echo 'machine that recorded them, and this job asserts the tolerances.'
              echo
              echo '```'
              cat "$RUNNER_TEMP/fel-debug.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
