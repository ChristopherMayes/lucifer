# Lucifer's own checks, on Linux.
#
# Every level Lucifer records was measured on one machine, an Apple M3 Max running
# macOS. This job runs the same checks on Linux, which is the only way a defect that
# one platform hides and another shows ever gets found. The project has paid for one
# already: five wake cases failed on Linux because a steady-state run read past the end
# of a one-element vector, and the macOS allocator had been answering with a number that
# happened to work. The debug build is what reaches that class, since -fbounds-check
# turns such a read into a failure rather than a wrong number.
#
# The build is against conda, and the first reason is the users: Bmad ships on
# conda-forge, so a conda build is the configuration most people will run, and a check is
# worth more against what is delivered than against a configuration only the off-site
# distribution assembles. It is also what the recording machine uses, through
# util/conda_compile, so the CI build and the recorded levels come from one arrangement.
#
# Two mechanical properties come with that choice. LAPACK comes from the environment
# rather than being built from source, and building it from source in a static debug
# configuration fails in its own archive step, a path the distribution's CI never takes
# because it builds shared. And the tracker and the reference then read one HDF5: lucifer
# resolves conda's through the rpath of the environment it was built in, and genesis4
# resolves its own, where a shared build reached through LD_LIBRARY_PATH would offer the
# reference a library it was not linked against. The recording machine keeps those two
# environments apart for exactly that reason.
#
# Bmad is not this repository's. It comes from a shallow clone of bmad-sim/bmad-ecosystem
# at the release lucifer/BMAD_RELEASE declares, checked by lucifer/util/bmad_release_check
# before anything is built, and nothing but lucifer/ and the workflows is read from this
# checkout. The declared release is a minimum, so a green run certifies that release and
# no later one.
#
# What this varies and what it does not, so the coverage is not overstated. It varies the
# operating system, the C library, the allocator and every dependency build, and it runs
# the tiers and the check sections, which nothing outside this laptop has ever run. It
# does not vary the compiler project, which is conda-forge gfortran on both sides. The
# distribution's own ci.yml builds with the system compiler on every push, which is how an
# unconditional -lfftw3f was caught, and it runs no tier.
#
# It does NOT compare digits. A different FFTW and HDF5 give different last digits by
# construction, so the eleven recorded tier levels stay a property of the machine that
# recorded them and the tolerances are what gets asserted here. A reader who believes
# this job guards the recorded digits will eventually trust it to.
#
# What is deliberately not here, so the difference from the local keystone is on the
# record: the production build and the two-build digit comparison, the examples, and
# Bmad's own regression suite, which ci.yml already runs. The device section cannot run
# on a runner with no Metal device and skips with its reason recorded, the one section allowed
# to.
#
# `workflow_dispatch` and `schedule` read this file from the repository's DEFAULT branch
# rather than from the ref they name, which is GitHub's rule for both. They were inert
# while the fork's default branch was `main` and this file lived only on `lucifer-dev`,
# and they went live when `lucifer-dev` became the default: a dispatch against that ref
# now returns a run rather than a 404. `push` is the trigger that reads the pushed ref,
# and it is the one that does not depend on which branch is the default.
#
# On every push to the branch, and weekly besides. Every commit here is validated before
# it lands, and the keystone that does it runs on one macOS machine, so a per-push run is
# what extends that rule to a second platform. The wall clock recorded below is the
# price, and the concurrency group above bounds it: a second push cancels the first run
# rather than queueing behind it, so a day of six pushes costs one run and not six. A
# path filter would be no substitute, since the defects this reaches come from the
# platform rather than from which file moved.
#
# It does not replace the per-push build coverage from ci.yml, conda-build.yml and
# pytao.yml, which build the whole distribution and are what caught a compile error this
# job would have reached only on the following Monday.

name: Lucifer - Keystone (Linux)

permissions:
  contents: read

on:
  push:
    branches: [lucifer-dev]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keystone:
    runs-on: ubuntu-latest
    # Measured on this runner, from the run that proved this file: 37.5 minutes end to
    # end, of which the harness is 30, the build 6.4 and the two environments 1.1. The
    # harness costs four times its local 7.7 minutes because a runner has four cores
    # against the recording machine's sixteen and its Genesis references are always cold,
    # and its longest sections are spontaneous at 642 s and the eleven tiers at 320 s.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      # The declared Bmad release, at its tag, outside this checkout. The check prints the
      # clone's release beside the declared minimum and refuses a clone below it. BMAD_DIR
      # reaches every later step through GITHUB_ENV, which is how the harness finds the
      # Bmad source, its Tao and its regression suite.
      - name: Clone the declared Bmad release
        shell: bash
        run: |
          set -e
          tag="$(head -n 1 lucifer/BMAD_RELEASE | tr -d '[:space:]')"
          git clone --depth 1 --branch "$tag" \
              https://github.com/bmad-sim/bmad-ecosystem.git "$RUNNER_TEMP/bmad"
          echo "Bmad clone: tag $tag, commit $(git -C "$RUNNER_TEMP/bmad" rev-parse HEAD)"
          lucifer/util/bmad_release_check "$RUNNER_TEMP/bmad"
          echo "BMAD_DIR=$RUNNER_TEMP/bmad" >> "$GITHUB_ENV"

      # Two packages the build needs on Linux and not on macOS. The distribution's own
      # conda-build.yml appends the same two, and the file is the distribution's, so the
      # append happens here in the runner rather than in the clone's tree. The file is
      # copied into the workspace first: setup-miniconda reads environment-file relative to
      # the workspace even when given an absolute path, and an absolute path under the
      # runner's temporary directory failed as the workspace path joined to it.
      - name: Include the Linux-only build requirements
        shell: bash
        run: |
          cp "$RUNNER_TEMP/bmad/.github/bmad-build-env.yaml" bmad-build-env.yaml
          echo '  - libacl' >> bmad-build-env.yaml
          echo '  - libgomp' >> bmad-build-env.yaml

      - name: Install the build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: bmad-build
          channels: conda-forge
          environment-file: bmad-build-env.yaml
          python-version: "3.12"
          conda-remove-defaults: true

      # The preferences are the ones lucifer/util/conda_compile writes on the recording
      # machine, less two macOS-only lines: that script restores util/dist_prefs from
      # origin/main, which a shallow clone of one tag does not have, and it passes a
      # linker flag the GNU linker rejects. So the steps are written out here, against the
      # clone, and the release check they would have run ran in the clone step above. HDF5_ROOT pins the library to this environment, the same
      # reason conda_compile sets it: CMake's FindHDF5 otherwise prefers whichever h5fc
      # is first on PATH, and a mismatch across a major version can compile and link.
      #
      # OpenMP is on because the harness reruns a time-dependent tier at eight threads
      # and requires it to reproduce one thread bit for bit. MPI is off, since Lucifer is
      # shared memory and the reference runs single process. The test executables are off,
      # which drops regression_tests from the build list and nothing else: this job does
      # not run that suite, ci.yml does, and building it is minutes a runner spends on
      # binaries no step here executes.
      #
      # The `set +e` is load-bearing, and finding out why cost three rounds.
      # util/dist_source_me is an environment script in Bourne style whose last statement
      # is a test that is false on a perfectly good run, so it returns non-zero and ends
      # any shell that has errexit set. The distribution's own install_bmad.sh runs it
      # from a script with no -e for that reason. Here errexit arrives on its own:
      # setup-miniconda appends `set -eo pipefail` into conda.sh, so every shell that
      # initializes conda has it, whether the step asked for it or not, and a login shell
      # picks the same thing up through the profile. The death is silent because
      # ACC_CONDA_BUILD=Y makes dist_source_me write its log to a file rather than the
      # terminal, so the step failed in one second with no output at all.
      #
      # The build command's status is therefore checked explicitly, and the three
      # binaries the later steps need are listed after it, so a build that half worked
      # cannot pass.
      - name: Build the debug tree
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          set +e
          conda activate bmad-build
          export HDF5_ROOT="$CONDA_PREFIX"
          # A name of this step's own for the clone, since dist_source_me overwrites
          # BMAD_DIR, and it takes the working directory as the Bmad root.
          bmad_root="$RUNNER_TEMP/bmad"
          cd "$bmad_root" || exit 1
          cat <<PREFS >> util/dist_prefs
          export DIST_F90_REQUEST="gfortran"
          export ACC_PLOT_PACKAGE="pgplot"
          export ACC_PLOT_DISPLAY_TYPE="X"
          export ACC_ENABLE_OPENMP="Y"
          export ACC_ENABLE_MPI="N"
          export ACC_FORCE_BUILTIN_MPI="N"
          export ACC_ENABLE_GFORTRAN_OPTIMIZATION="N"
          export ACC_ENABLE_SHARED="Y"
          export ACC_ENABLE_SHARED_ONLY="N"
          export ACC_ENABLE_FPIC="Y"
          export ACC_ENABLE_PROFILING="N"
          export ACC_SET_GMAKE_JOBS="$(nproc)"
          export ACC_CONDA_BUILD="Y"
          export ACC_CONDA_BUILD_TESTS="N"
          export ACC_CONDA_PATH="$CONDA_PREFIX"
          export ACC_USE_MACPORTS="N"
          PREFS
          cp "$CONDA_PREFIX/share/gnuconfig/config."* .
          source ./util/dist_source_me
          ./util/dist_build_debug
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "util/dist_build_debug exited $status"
            exit "$status"
          fi
          # Lucifer is a Bmad user program and is built after the distribution, through
          # Master.cmake with the environment dist_source_me set, into debug/ beside its
          # source, which here is this checkout's root and not the clone.
          (cd "$GITHUB_WORKSPACE/lucifer" && mkd)
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "mkd in lucifer/ exited $status"
            exit "$status"
          fi
          cd "$GITHUB_WORKSPACE" || exit 1
          ls -l debug/bin/lucifer debug/bin/lucifer_smoke_test debug/bin/wavefront_drift_test \
                "$bmad_root/debug/bin/tao"

      # Which backend this build carries, from lucifer's own banner. This is the line the
      # harness reads to decide whether the device section can run, so having it in the
      # log makes the skip below checkable rather than asserted.
      - name: Name the device backend
        shell: bash
        run: ./debug/bin/lucifer || true

      # One environment for the reference and the Python side, from the repository's own
      # file, which pins genesis4 4.6.15. The pin is the whole reason this job is
      # possible: releases to 4.6.14 carry a pre-CODATA electron rest energy and seed
      # their noise per MPI rank, and the harness refuses any other version, printing what it found and wanted. It
      # is separate from the build environment for the reason the recording machine keeps
      # them separate, and the harness finds it by name.
      - name: Install the reference and the Python side
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          set -e
          conda env create -f lucifer/wavefront/tests/environment.yml
          # The reference's own banner, so a wrong version is visible here rather than
          # only in the harness's refusal. genesis4 exits non-zero when it is given no
          # input file, which is not a failure of this step.
          conda run -n bmad-fel-validate genesis4 2>&1 | head -3 || true
          # openPMD-beamphysics comes from the same file, at the minimum it states or
          # later. The harness prints the version and path again before its sections run.
          conda run -n bmad-fel-validate python -c \
              "import beamphysics; print('openPMD-beamphysics', beamphysics.__version__)"

      # The harness prints the reference version and the electron rest energy it carries,
      # every section's name and wall time, and every tier's level against its tolerance.
      # Its exit status is zero only if every tier passed. Run from the validate
      # environment, which is how the recording machine runs it.
      - name: Benchmark harness, debug build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./lucifer/tests/run_fel_benchmark.sh \
              --exe "$PWD/debug/bin/lucifer" --build debug \
              --results "$RUNNER_TEMP/fel-debug.txt" \
              --work-dir "$RUNNER_TEMP/wd-dbg"

      - name: Wavefront validation
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./lucifer/wavefront/tests/run_validation.sh \
              --work-dir "$RUNNER_TEMP/wd-wf"

      # The results file records what ran, what skipped and why, and each tier's level.
      # It is not what writes the generated table: report_validation.py refuses a file
      # carrying a skip, because that table names every section that ran and this run is
      # one short. The table stays the product of a full local run on both builds.
      - name: Summarize
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fel-debug.txt" ]; then
            {
              echo '## Lucifer keystone, Linux debug build'
              echo
              echo 'Levels are this platform'"'"'s own. The recorded digits belong to the'
              echo 'machine that recorded them, and this job asserts the tolerances.'
              echo
              echo '```'
              cat "$RUNNER_TEMP/fel-debug.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
