# Lucifer's own checks, on Linux: the validation suite, tests/run_fel_validation.sh, and the
# wavefront validation, on the debug build and on the release build, each in a job of its
# own. This is not the keystone, which runs on the recording machine (docs/validation.md).
# Nothing here judges a wall clock. The times the log prints are what each section cost,
# and performance is measured by tests/run_perf_benchmark.sh on an idle machine and never
# here (docs/performance.md).
#
# Every level Lucifer records was measured on one machine, an Apple M3 Max running
# macOS. This job runs the same checks on Linux, which is the only way a defect that
# one platform hides and another shows ever gets found. The project has paid for one
# already: five wake cases failed on Linux because a steady-state run read past the end
# of a one-element vector, and the macOS allocator had been answering with a number that
# happened to work. The debug build is what reaches that class, since -fbounds-check
# turns such a read into a failure rather than a wrong number.
#
# The release build is the one the conda-forge lucifer package ships and users run, and
# what it differs in the debug build cannot reach: every file at -O2 where the debug build
# has -O0, with the floating-point contraction an optimizing compiler does. Both builds
# compile fel_track_mod at -O3 with the paired-sincos shim. The two run as one job
# definition over a matrix of the two builds, on two runners at once, and neither cancels
# the other when it fails, so a defect that one build carries and the other does not fails
# the one job that carries it.
#
# Bmad comes from conda-forge's bmad package, installed from environment.yml at the
# repository root, and Lucifer builds against it with the two cmake lines of
# docs/user-guide.md, the first route there. Bmad ships on conda-forge, so this is the
# configuration most people will run, and a check is worth more against what is delivered
# than against a configuration only the off-site distribution assembles. Nothing is
# cloned and no distribution is built: until 2026-10-23 the job cloned bmad-sim/bmad-ecosystem
# at the declared release and built its debug tree for 6.4 minutes before Lucifer's own
# build began. util/bmad_release_check reads the package's release from its
# bmad_version_mod.mod and refuses one below BMAD_RELEASE before anything is built. The
# declared release is a minimum, so a green run certifies that release and no later one.
#
# The package is a production build of Bmad. Both of Lucifer's configurations are built
# against it, so in the debug job Lucifer's own code runs with -fbounds-check and Bmad's
# does not, where the recording machine's debug pass runs both bounds-checked against the
# distribution's debug tree. The tracker and the reference read one HDF5: lucifer resolves the package
# environment's through the rpath it was built with, and genesis4 resolves its own, where
# a shared build reached through LD_LIBRARY_PATH would offer the reference a library it
# was not linked against. The recording machine keeps those two environments apart for
# exactly that reason.
#
# What this varies and what it does not, so the coverage is not overstated. It varies the
# operating system, the C library, the allocator, every dependency build and the Bmad
# build itself, which is conda-forge's and not the distribution's, and it runs the tiers
# and the check sections, which nothing outside this laptop has ever run. It does not
# vary the compiler project, which is conda-forge gfortran on both sides. The
# distribution's own CI builds with the system compiler, which is how an unconditional
# -lfftw3f was caught, and it runs no tier.
#
# It does NOT compare digits. A different FFTW and HDF5 give different last digits by
# construction, so the eleven recorded tier levels stay a property of the machine that
# recorded them and the tolerances are what gets asserted here. A reader who believes
# this job guards the recorded digits will eventually trust it to.
#
# What is deliberately not here, so the difference from the local keystone is on the
# record: the recorded digits of either build, the examples but the steady-state one,
# which each job runs once from its installed tracker, and Bmad's own regression suite,
# which the package does not carry and Bmad's own CI runs. The device section cannot run
# on a runner with no Metal device and skips with its reason recorded in both jobs, the
# one section allowed to.
#
# `workflow_dispatch` and `schedule` read this file from the repository's default branch,
# main, rather than from the ref they name, which is GitHub's rule for both. `push` is the
# trigger that reads the pushed ref.
#
# On every push to the branch, and weekly besides. Every commit here is validated before
# it lands, and the keystone that does it runs on one macOS machine, so a per-push run is
# what extends that rule to a second platform. The wall clock recorded below is the
# price, and the concurrency group below bounds it: a second push cancels the first run
# rather than queueing behind it, so a day of six pushes costs one run and not six. A
# path filter would be no substitute, since the defects this reaches come from the
# platform rather than from which file moved.
#
# It does not replace Bmad's own CI, which builds the whole distribution on every push
# to Bmad.

name: Lucifer - Validation (Linux)

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation, ${{ matrix.build }} build
    runs-on: ubuntu-latest
    # build names the job and its steps, config is CMake's configuration, dir the build
    # directory, and flavor what the validation suite's --build takes and its results
    # file records.
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: debug
            config: Debug
            dir: build-debug
            flavor: debug
          - build: release
            config: Release
            dir: build-release
            flavor: production
    # Measured on this runner on 2026-10-30, the first run of both jobs, against the
    # conda-forge package. The debug job took 23.7 minutes end to end, of which the
    # validation suite is 21.8 and the Lucifer build 0.6. The release job took 31.6 minutes,
    # of which the validation suite is 28.9 and the Lucifer build 1.0. The two run at once,
    # so the run took 31.6 minutes. The debug job alone took 36.0 minutes on 2026-10-24,
    # with 33.9 in the validation suite, so a runner's minutes move by a third between runs
    # and say nothing about which build is faster. The validation suite costs three to four
    # times its local 7.7 minutes because a runner has four cores against the recording
    # machine's sixteen and its Genesis references are always cold.
    timeout-minutes: 120

    steps:
      # The whole history, so the tags reach git describe and the build carries the
      # version cmake/LuciferVersion.cmake reads from them. A clone of depth one has no
      # tag and the version is the commit alone.
      - name: Check out the repository, ${{ matrix.build }} build
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The build environment is the repository's own file: conda-forge's bmad in its
      # nompi variant, the compilers and cmake, each a minimum. The package resolves on the
      # day the job runs, so the release it carries is checked against BMAD_RELEASE below
      # and printed.
      - name: Install the build environment, conda-forge bmad and the compilers, ${{ matrix.build }} build
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          use-mamba: true
          activate-environment: lucifer-build
          channels: conda-forge
          environment-file: environment.yml
          conda-remove-defaults: true

      # The package's release against the declared minimum, read from the module file the
      # package installs. The check prints both and refuses a package below the minimum.
      - name: Check the package's release, ${{ matrix.build }} build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate lucifer-build
          set -e
          conda list bmad | grep '^bmad '
          util/bmad_release_check "$CONDA_PREFIX"

      # The two cmake lines of the user guide, in this job's configuration. The Fortran and
      # C compilers are named by path, since the compiler packages export nothing on
      # activation and CMake would otherwise take the first gfortran on PATH. HDF5_ROOT pins
      # the library to this environment, since CMake's FindHDF5 otherwise prefers whichever
      # h5fc is first on PATH, and a mismatch across a major version can compile and link.
      # The three binaries the later steps need are listed after the build, so a build
      # that half worked cannot pass.
      - name: Build the ${{ matrix.build }} configuration against the package
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate lucifer-build
          set -e
          export FC="$CONDA_PREFIX/bin/gfortran"
          for f in "$CONDA_PREFIX"/bin/*-cc "$CONDA_PREFIX"/bin/*-gcc "$CONDA_PREFIX"/bin/clang; do
            [ -x "$f" ] && { export CC="$f"; break; }
          done
          echo "FC=$FC CC=${CC:-unset, so CMake chooses}"
          cmake -S . -B ${{ matrix.dir }} -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
                -DLUCIFER_BMAD_ROOT="$CONDA_PREFIX" -DHDF5_ROOT="$CONDA_PREFIX"
          cmake --build ${{ matrix.dir }} --parallel "$(nproc)"
          ls -l ${{ matrix.dir }}/bin/lucifer ${{ matrix.dir }}/bin/lucifer_smoke_test \
                ${{ matrix.dir }}/bin/wavefront_drift_test "$CONDA_PREFIX/bin/tao"
          echo "LUCIFER_BMAD_ROOT=$CONDA_PREFIX" >> "$GITHUB_ENV"

      # The install rule. cmake --install places the tracker alone in the prefix's bin/,
      # and the installed tracker prints its version and runs the steady-state example
      # from a directory outside the tree, in an empty environment, so the libraries come
      # from its rpath and nothing else.
      - name: Install the ${{ matrix.build }} tracker and run steady_state from the prefix
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate lucifer-build
          set -e
          cmake --install ${{ matrix.dir }} --prefix "$RUNNER_TEMP/prefix"
          find "$RUNNER_TEMP/prefix" -type f
          mkdir -p "$RUNNER_TEMP/installed/steady_state"
          cp examples/steady_state/lucifer.toml "$RUNNER_TEMP/installed/steady_state/"
          cp examples/aramis.bmad "$RUNNER_TEMP/installed/"
          cd "$RUNNER_TEMP/installed/steady_state"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP/prefix/bin/lucifer" --version
          env -i HOME="$HOME" PATH=/usr/bin:/bin OMP_NUM_THREADS=4 \
              "$RUNNER_TEMP/prefix/bin/lucifer" lucifer.toml > run.log
          grep -e '^ Lucifer version' -e '^ Exit ' run.log
          test -s steady_state.stats.h5

      # Which backend this build carries, from lucifer's own banner. This is the line the
      # validation suite reads to decide whether the device section can run, so having it in the
      # log makes the skip below checkable rather than asserted.
      - name: Print the ${{ matrix.build }} build's device backend
        shell: bash
        run: ./${{ matrix.dir }}/bin/lucifer || true

      # One environment for the reference and the Python side, from the repository's own
      # file, which pins genesis4 4.6.15. The pin is the whole reason this job is possible:
      # releases to 4.6.14 carry a pre-CODATA electron rest energy and seed their noise per
      # MPI rank, and the validation suite refuses any other version, printing what it found
      # and wanted. It is separate from the build environment for the reason the recording
      # machine keeps them separate, and the validation suite finds it by name.
      - name: Install genesis4 and the Python package, ${{ matrix.build }} build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          set -e
          conda env create -f tests/environment-validate.yml
          # The repository's own Python package, which the check scripts import, into
          # the validation environment with its own pip and no dependencies, as the
          # recording machine installs it.
          conda run -n bmad-fel-validate python -m pip install -e python --no-deps
          # The reference's own banner, so a wrong version is visible here rather than
          # only in the validation suite's refusal. genesis4 exits non-zero when it is given no
          # input file, so it runs inside a shell that exits zero after the banner, and
          # conda run then prints no error line for a status this step ignores anyway.
          conda run -n bmad-fel-validate bash -c 'genesis4 2>&1 | head -3; true'
          # openPMD-beamphysics comes from the same file, at the minimum it states or
          # later. The validation suite prints the version and path again before its sections run.
          conda run -n bmad-fel-validate python -c \
              "import beamphysics; print('openPMD-beamphysics', beamphysics.__version__)"

      # The validation suite prints the reference version and the electron rest energy it carries,
      # every section's name and wall time, and every tier's level against its tolerance.
      # Its header names the build --build declares, debug or production. Its exit status
      # is zero only if every tier passed. Run from the validate environment, which is how
      # the recording machine runs it.
      - name: Validation suite against Genesis4, ${{ matrix.build }} build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./tests/run_fel_validation.sh \
              --exe "$PWD/${{ matrix.dir }}/bin/lucifer" --build ${{ matrix.flavor }} \
              --results "$RUNNER_TEMP/fel-${{ matrix.build }}.txt" \
              --work-dir "$RUNNER_TEMP/wd-${{ matrix.build }}"

      # The propagator this job's build compiled, named, since the script's default tries
      # the debug build first.
      - name: Wavefront validation, ${{ matrix.build }} build
        shell: bash -o pipefail {0}
        run: |
          source "$CONDA/etc/profile.d/conda.sh"
          conda activate bmad-fel-validate
          set -e
          ./tests/wavefront/run_validation.sh \
              --exe "$PWD/${{ matrix.dir }}/bin/wavefront_drift_test" \
              --work-dir "$RUNNER_TEMP/wd-wf-${{ matrix.build }}"

      # The results file records what ran, what skipped and why, and each tier's level.
      # It is not what writes the generated table: report_validation.py refuses a file
      # carrying a skip, because that table names every section that ran and this run is
      # one short. The table stays the product of a full local run on both builds.
      - name: Summarize the validation suite's levels, ${{ matrix.build }} build
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fel-${{ matrix.build }}.txt" ]; then
            {
              echo '## Lucifer validation suite, Linux ${{ matrix.build }} build'
              echo
              echo 'Levels are this platform'"'"'s own. The recorded digits belong to the'
              echo 'machine that recorded them, and this job asserts the tolerances.'
              echo
              echo '```'
              cat "$RUNNER_TEMP/fel-${{ matrix.build }}.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
