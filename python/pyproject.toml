[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lucifer"
dynamic = ["version"]
description = "The Python side of Lucifer: the input file as typed models, the schema, a runner and the readers of its output files."
# Python 3.11 is the first with tomllib, which reads the input file. The readers import
# numpy and h5py. Each minimum is the lowest the package's tests have passed under, measured
# with Python 3.11, numpy 1.24.4 and h5py 3.8.0 from conda-forge.
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "h5py>=3.8"]
# The program's license, the text of which is LICENSE at the repository root. setuptools
# 77 is the first to read an SPDX expression here.
license = "GPL-3.0-only"
authors = [{name = "Christopher Mayes"}]

[project.urls]
Homepage = "https://github.com/ChristopherMayes/lucifer"
Documentation = "https://christophermayes.github.io/lucifer/"
Issues = "https://github.com/ChristopherMayes/lucifer/issues"

[project.optional-dependencies]
# The plots: lucifer.plot and the plot methods of Stats and Result. matplotlib, numpy
# and h5py come with it.
plot = ["openpmd-beamphysics>=0.16.3"]

# The version is the program's, read from the same git tag by setuptools-scm, and from
# .git_archival.txt at the repository root in a release archive, which has no .git.
[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["lucifer*"]

[tool.setuptools.package-data]
lucifer = ["schema.json"]
