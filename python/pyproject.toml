[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lucifer"
dynamic = ["version"]
description = "The Python side of Lucifer: the input file as typed models, the schema, a runner and the readers of its output files."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The plots: lucifer.plot and the plot methods of Stats and Result. matplotlib, numpy
# and h5py come with it.
plot = ["openpmd-beamphysics>=0.16.3"]

# The version is the program's, read from the same git tag by setuptools-scm, and from
# .git_archival.txt at the repository root in a release archive, which has no .git.
[tool.setuptools_scm]
root = ".."
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["lucifer*"]

[tool.setuptools.package-data]
lucifer = ["schema.json"]
