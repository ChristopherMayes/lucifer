[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucifer"
version = "0.0.0"
description = "The Python side of Lucifer: the input file as typed models, the schema, a runner and the readers of its output files."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The plots: lucifer.plot and the plot methods of Stats and Result. matplotlib, numpy
# and h5py come with it.
plot = ["openpmd-beamphysics>=0.16.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lucifer*"]

[tool.setuptools.package-data]
lucifer = ["schema.json"]
